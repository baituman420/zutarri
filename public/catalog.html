<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Zutarri Assets Catalog</title>
<style>
  body { background: #111; color: #eee; font-family: sans-serif; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
  .card { background: #1c1c1f; border: 1px solid #333; padding: 10px; border-radius: 4px; }
  img { width: 100%; height: 220px; object-fit: cover; background: #000; border-radius: 2px; }
  .name { font-size: 12px; word-break: break-all; margin-top: 8px; font-weight: bold; }
  .meta { font-size: 11px; color: #888; margin-top: 4px; }
</style>
</head>
<body>
<h1>Zutarri Assets Images Catalog</h1>
<div class="grid" id="grid"></div>
<script>
const files = [
  "479157181_1132919598844251_6811334955080910585_n.jpg",
  "489831894_1182287033907507_5461469736588144410_n.jpg",
  "Cocina rústica con plato colorido.png",
  "Golpe de mazos sobre madera envejecida-hero.png",
  "Tortilla gourmet ante festival de leña.png",
  "amasado-talo-color.png",
  "caption.jpg",
  "comedor.jpg",
  "cuadro-amasando.jpg",
  "cuadro-restaurante.jpg",
  "images (1).jpeg",
  "images (2).jpeg",
  "images (3).jpeg",
  "images.jpeg",
  "logo-piedras.png",
  "mural-pared-restaurante.jpg",
  "talo.jpg",
  "talo1.jpg",
  "unnamed (1).webp",
  "unnamed (10).webp",
  "unnamed (11).webp",
  "unnamed (12).webp",
  "unnamed (13).webp",
  "unnamed (14).webp",
  "unnamed (15).webp",
  "unnamed (16).webp",
  "unnamed (17).webp",
  "unnamed (18).webp",
  "unnamed (19).webp",
  "unnamed (2).webp",
  "unnamed (20).webp",
  "unnamed (21).webp",
  "unnamed (22).webp",
  "unnamed (23).webp",
  "unnamed (24).webp",
  "unnamed (25).webp",
  "unnamed (3).webp",
  "unnamed (4).webp",
  "unnamed (5).webp",
  "unnamed (6).webp",
  "unnamed (7).webp",
  "unnamed (8).webp",
  "unnamed (9).webp",
  "unnamed.webp"
];

const grid = document.getElementById('grid');
files.forEach(f => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <img src="/assets/images/${encodeURIComponent(f)}" alt="${f}">
    <div class="name">${f}</div>
  `;
  grid.appendChild(card);
});
</script>
</body>
</html>
